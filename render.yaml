# Render blueprint for the API. The web app on Vercel calls it through its proxy.
services:
  - type: web
    name: claimcheck-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PROXY_SECRET
        sync: false
      - key: MODEL
        value: google_genai:gemini-3.1-flash-lite
      - key: FALLBACK_MODEL
        value: google_genai:gemini-3.5-flash-lite
      # The web proxy holds a stream open for at most 300 seconds.
      - key: LIMIT_SECONDS
        value: "280"
      - key: LANGSMITH_TRACING
        value: "false"
